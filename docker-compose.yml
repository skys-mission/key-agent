services:
  key-agent:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        DATE: ${DATE:-unknown}
        # Go proxy (uncomment if network is blocked)
        # GOPROXY: https://goproxy.cn,direct
    image: key-agent:${VERSION:-latest}
    container_name: key-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - key-agent-data:/data
    environment:
      # Server address (bind to all interfaces in container)
      - KEY_AGENT_ADDR=0.0.0.0:8080
      # Master key backend (file is required in containers)
      - KEY_AGENT_MASTER_KEY_BACKEND=file
      # Optional: Direct master key injection (base64-encoded 32-byte key)
      # Generate with: export KEY_AGENT_MASTER_KEY=$(openssl rand -base64 32)
      # - KEY_AGENT_MASTER_KEY=${KEY_AGENT_MASTER_KEY}
      # Optional: Passphrase for encrypted master key file
      # If not set, a random passphrase will be auto-generated and saved.
      # - KEY_AGENT_PASSPHRASE=your-secure-passphrase
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  key-agent-data:
